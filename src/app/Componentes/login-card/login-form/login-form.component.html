<ion-list lines="none">
  <ion-item>
    <ion-input
      color="secondary"
      type="email"
      fill="solid"
      labelPlacement="floating"
      helperText="Introduce un email"
      errorText="El email es invalido"
      [(ngModel)]="usuario.correoElectronico"
      email
      mode="ios"
      ><div slot="label">
        Email
      </div></ion-input
    >
  </ion-item>

  <ion-item>
    <ion-input
      color="secondary"
      type="password"
      fill="solid"
      labelPlacement="floating"
      helperText="Introduce una contraseña"
      errorText="La contraseña es invalida"
      [(ngModel)]="usuario.clave"
      mode="ios"
      ><div slot="label">
        Contraseña
      </div></ion-input
    >
  </ion-item>

  <div class="ion-padding">
    <ion-button expand="block" type="submit"> Log in </ion-button>
  </div>
</ion-list>
