<div class="ion-text-center container-verificacion">
  <ion-icon name="mail-unread-outline" color="primary" style="font-size: 64px;"></ion-icon>

  <h2 class="ion-margin-top">¡Casi listo!</h2>

  <p class="ion-padding">
    Hemos enviado un enlace de verificación a:<br>
    <ion-text color="primary">
      <strong>{{ email }}</strong>
    </ion-text>
  </p>

  <ion-text color="medium">
    <p class="ion-no-margin">Por favor, revisa tu bandeja de entrada (y la carpeta de spam) y haz clic en el enlace para activar tu cuenta.</p>
  </ion-text>

  <div class="ion-margin-top" style="margin-top: 30px;">
    <ion-button fill="outline" style="--background: none;" (click)="reintentarLogin()">
      <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
      Volver al login
    </ion-button>
  </div>
</div>
