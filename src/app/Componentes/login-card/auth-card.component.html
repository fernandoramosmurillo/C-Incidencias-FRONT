<ion-card>
  <ion-card-header>
    <ion-card-title class="ion-display-flex ion-align-items-center">
      <img
        class="logo"
        [src]="environment.logoUrl"
        alt="Logo"
      />
      <ion-label>
        <h1 class="titulo-form">{{titulo}}</h1>
      </ion-label>
    </ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-grid class="contenidoFormulario">
      <ion-row>
        <ion-col
          class="ion-display-flex ion-flex-column ion-align-items-center"
          style="margin-top: 6%"
        >
          <h2 style="margin-top: 2% !important">Inicia sesión para continuar</h2>
          <login-form/>
        </ion-col >
      </ion-row>
      <ion-row style="margin-top: 6%;">
        <ion-col class="ion-text-center">
         <a routerLink="/register">¿No tienes cuenta?. Registrate aquí</a>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-card-content>
</ion-card>
