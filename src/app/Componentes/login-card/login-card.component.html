<ion-card>
  <ion-card-header
    class="ion-display-flex ion-align-items-center ion-justify-content-center"
  >
    <ion-card-title
      class="ion-display-flex ion-align-items-center ion-justify-content-center"
    >
      <img class="logo" [src]="environment.logoUrl" alt="Logo" />
      <ion-label>C-incidencias</ion-label>
    </ion-card-title>
    <ion-card-subtitle class="ion-text-center"
      >Inicia sesión para continuar</ion-card-subtitle
    >
  </ion-card-header>

  <ion-card-content>
    Here's a small text description for the card content. Nothing more, nothing
    less.
  </ion-card-content>
</ion-card>
