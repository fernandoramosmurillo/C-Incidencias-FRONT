<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <img class="logo" [src]="environment.logoUrl" alt="Logo"/>
    </ion-buttons>
    <ion-buttons slot="">
      <ion-button>
        <ion-icon name="home"></ion-icon>
        Home
      </ion-button>
      <ion-button>
        <ion-icon name=""></ion-icon>
        Incidencias
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button class="boton-perfil">
        <ion-avatar slot="icon-only">
          <img alt="Perfil" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
        </ion-avatar>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
